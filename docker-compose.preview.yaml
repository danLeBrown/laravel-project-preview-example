services:
  app:
    build: .
    ports:
      - "8000:8000"
    # env_file:
    #   - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      DB_URL: postgresql://root:secret@postgres:5432/laravel_project_preview_example
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: laravel_project_preview_example
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
